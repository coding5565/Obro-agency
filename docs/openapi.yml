openapi: 3.0.3
info:
  title: OBRO’ Panel API
  version: 0.1.0
  description: OBRO Agency CRM va mijoz paneli
paths:
  /api/v1/ads/campaigns/:
    get:
      operationId: v1_ads_campaigns_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - ended
          - paused
        description: |-
          * `active` - Faol
          * `paused` - To‘xtatilgan
          * `ended` - Tugagan
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdCampaignList'
          description: ''
    post:
      operationId: v1_ads_campaigns_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdCampaignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdCampaignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdCampaignRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaign'
          description: ''
  /api/v1/ads/campaigns/{id}/:
    get:
      operationId: v1_ads_campaigns_retrieve
      parameters:
