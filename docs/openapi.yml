components:
  schemas:
    Accrual:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        user_name:
          type: string
          readOnly: true
        project:
          type: integer
        client_name:
          type: string
          readOnly: true
        position_name:
          type: string
          readOnly: true
        payment:
          type: integer
        base_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,4})?$
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        rate_to_uzs:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
        amount_uzs:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        accrued_on:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AccrualStatusEnum'
        status_label:
          type: string
          readOnly: true
      required:
      - accrued_on
      - amount
      - amount_uzs
      - base_amount
      - client_name
      - id
      - payment
      - percent
      - position_name
      - project
      - status_label
      - user
      - user_name
    AccrualStatusEnum:
      enum:
      - pending
      - approved
      - paid
      - cancelled
      type: string
      description: |-
        * `pending` - Hisoblandi
        * `approved` - Tasdiqlandi
        * `paid` - To‘landi
        * `cancelled` - Bekor qilindi
    AdCampaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        client_name:
          type: string
          readOnly: true
        platform:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 150
        objective:
          type: string
          maxLength: 80
        status:
          $ref: '#/components/schemas/Status064Enum'
        started_on:
          type: string
          format: date
          nullable: true
        ended_on:
          type: string
          format: date
          nullable: true
      required:
      - client_name
      - id
      - name
      - project
    AdCampaignRequest:
      type: object
      properties:
        project:
          type: integer
        platform:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 150
        objective:
          type: string
          maxLength: 80
        status:
          $ref: '#/components/schemas/Status064Enum'
        started_on:
          type: string
          format: date
          nullable: true
        ended_on:
          type: string
          format: date
          nullable: true
      required:
      - name
      - project
    AdStat:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        campaign:
          type: integer
        date:
          type: string
          format: date
        spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        impressions:
          type: integer
          maximum: 2147483647
          minimum: 0
        clicks:
          type: integer
          maximum: 2147483647
          minimum: 0
        leads:
          type: integer
          maximum: 2147483647
          minimum: 0
        source:
          allOf:
          - $ref: '#/components/schemas/SourceCbaEnum'
          readOnly: true
      required:
      - campaign
      - date
      - id
      - source
    AdStatRequest:
      type: object
      properties:
        campaign:
          type: integer
        date:
          type: string
          format: date
        spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        impressions:
          type: integer
          maximum: 2147483647
          minimum: 0
        clicks:
          type: integer
          maximum: 2147483647
          minimum: 0
        leads:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - campaign
      - date
    Adjustment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        user_name:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/AdjustmentKindEnum'
        kind_label:
          type: string
          readOnly: true
        amount_uzs:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          description: Avans va jarima musbat kiritiladi, hisobda ayiriladi
        year:
          type: integer
          maximum: 32767
          minimum: 0
        month:
          type: integer
          maximum: 32767
          minimum: 0
        reason:
          type: string
          maxLength: 255
        project:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_uzs
      - created_at
      - id
      - kind
      - kind_label
      - month
      - reason
      - user
      - user_name
      - year
    AdjustmentKindEnum:
      enum:
      - advance
      - bonus
      - penalty
      - piecework
      - other
      type: string
      description: |-
        * `advance` - Avans
        * `bonus` - Bonus
        * `penalty` - Jarima
        * `piecework` - Dona ish
        * `other` - Boshqa
    AdjustmentRequest:
      type: object
      properties:
        user:
          type: integer
        kind:
          $ref: '#/components/schemas/AdjustmentKindEnum'
        amount_uzs:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          description: Avans va jarima musbat kiritiladi, hisobda ayiriladi
        year:
          type: integer
          maximum: 32767
          minimum: 0
        month:
          type: integer
          maximum: 32767
          minimum: 0
        reason:
          type: string
          minLength: 1
          maxLength: 255
        project:
          type: integer
          nullable: true
      required:
      - amount_uzs
      - kind
      - month
      - reason
      - user
      - year
    Allocation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        invoice:
          type: integer
        invoice_number:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - amount
      - id
      - invoice
      - invoice_number
    AllocationRequest:
      type: object
      properties:
        invoice:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - amount
      - invoice
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        user:
          type: integer
        user_name:
          type: string
          readOnly: true
        position:
          type: integer
        position_detail:
